[project]
name = "order-intake-observability"
version = "0.1.0"
description = "A 4-step LangGraph order intake pipeline, traced with MLflow"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-groq",
    "mlflow>=3",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the Groq API, needs GROQ_API_KEY (run with -m live)"]
